<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calculator">
    <div class="display">
      <div class="history" id="history"></div>
      <div class="current" id="current">0</div>
    </div>
    <div class="keys">
      <button data-action="clear" class="fn" aria-label="Clear">AC</button>
      <button data-action="delete" class="fn" aria-label="Backspace"><i class="fa-solid fa-delete-left"></i></button>
      <button data-action="percent" class="fn" aria-label="Percent"><i class="fa-solid fa-percent"></i></button>
      <button data-op="/" class="op" aria-label="Divide"><i class="fa-solid fa-divide"></i></button>

      <button data-num="7">7</button>
      <button data-num="8">8</button>
      <button data-num="9">9</button>
      <button data-op="*" class="op" aria-label="Multiply"><i class="fa-solid fa-xmark"></i></button>

      <button data-num="4">4</button>
      <button data-num="5">5</button>
      <button data-num="6">6</button>
      <button data-op="-" class="op" aria-label="Subtract"><i class="fa-solid fa-minus"></i></button>

      <button data-num="1">1</button>
      <button data-num="2">2</button>
      <button data-num="3">3</button>
      <button data-op="+" class="op" aria-label="Add"><i class="fa-solid fa-plus"></i></button>

      <button data-action="negate" aria-label="Toggle sign"><i class="fa-solid fa-plus-minus"></i></button>
      <button data-num="0">0</button>
      <button data-action="decimal" aria-label="Decimal point">.</button>
      <button data-action="equals" class="eq" aria-label="Equals"><i class="fa-solid fa-equals"></i></button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
